[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-expense-classifier"
version = "0.1.0"
description = "Simple expense classifier (RU) from transaction text/merchant/amount"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools]
packages = ["expense_classifier"]
